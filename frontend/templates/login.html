{% extends "base.html" %}
{% block title %}CAPZONE | Login{% endblock %}
{% block content %}
<section class="container auth-page">
    <div class="auth-card">
        <div class="auth-tabs">
            <a href="{% url 'login' %}" class="auth-tab active">Login</a>
            <a href="{% url 'register' %}" class="auth-tab">Register</a>
        </div>
        <h2>Welcome back</h2>
        <form method="post">
            {% csrf_token %}
            <label>Email
                <input type="email" name="email" required>
            </label>
            <label>Password
                <input type="password" name="password" required>
            </label>
            <button type="submit" class="primary-btn full-width">Enter</button>
        </form>
        <p class="auth-switch">Need an account? <a href="{% url 'register' %}">Create one here</a></p>
    </div>
</section>
{% endblock %}
