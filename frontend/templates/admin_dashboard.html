{% extends "base.html" %}
{% block title %}CAPZONE | Admin dashboard{% endblock %}
{% block content %}
<section class="container admin-page">
    <div class="section-heading">
        <div>
            <span class="eyebrow">Operations</span>
            <h2>Admin dashboard</h2>
        </div>
    </div>
    <div class="stats-grid">
        <div class="stat-card"><span>Total products</span><strong>{{ stats.total_products }}</strong></div>
        <div class="stat-card"><span>Available</span><strong>{{ stats.available_products }}</strong></div>
        <div class="stat-card"><span>Total orders</span><strong>{{ stats.total_orders }}</strong></div>
        <div class="stat-card"><span>Revenue</span><strong>${{ stats.revenue }}</strong></div>
    </div>
</section>
{% endblock %}
