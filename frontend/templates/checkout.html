{% extends "base.html" %}
{% block title %}CAPZONE | Checkout{% endblock %}
{% block content %}
<section class="container checkout-page">
    <div class="checkout-box">
        <h2>Checkout</h2>
        <form method="post">
            {% csrf_token %}
            <label>Shipping address
                <textarea name="shipping_address" rows="4" required></textarea>
            </label>
            <label>Contact phone
                <input type="text" name="contact_phone" required>
            </label>
            <button type="submit" class="primary-btn full-width">Complete purchase</button>
        </form>
    </div>
</section>
{% endblock %}
