{% extends "base.html" %}
{% block title %}TechGear | Finalizar compra{% endblock %}
{% block content %}
<section class="container checkout-page">
    <div class="checkout-box">
        <span class="eyebrow">Último paso</span>
        <h2>Finalizar compra</h2>
        <form method="post">
            {% csrf_token %}
            <label>Dirección de entrega
                <textarea name="shipping_address" rows="4" required></textarea>
            </label>
            <label>Teléfono de contacto
                <input type="tel" name="contact_phone" autocomplete="tel" required>
            </label>
            <button type="submit" class="primary-btn full-width">Confirmar pedido</button>
        </form>
    </div>
</section>
{% endblock %}
