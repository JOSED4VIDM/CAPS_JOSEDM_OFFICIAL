{% extends "base.html" %}
{% block title %}CAPZONE | Crear cuenta{% endblock %}
{% block content %}
<section class="container auth-page">
    <div class="auth-card">
        <div class="auth-tabs">
            <a href="{% url 'login' %}" class="auth-tab">Iniciar sesión</a>
            <a href="{% url 'register' %}" class="auth-tab active">Crear cuenta</a>
        </div>
        <span class="eyebrow">Únete a la comunidad</span>
        <h2>Crea tu cuenta</h2>
        <form method="post">
            {% csrf_token %}
            <label>Nombre completo
                <input type="text" name="full_name" autocomplete="name" required>
            </label>
            <label>Correo electrónico
                <input type="email" name="email" autocomplete="email" required>
            </label>
            <label>Contraseña
                <input type="password" name="password" autocomplete="new-password" required>
            </label>
            <button type="submit" class="primary-btn full-width">Crear cuenta</button>
        </form>
        <p class="auth-switch">¿Ya tienes una cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
    </div>
</section>
{% endblock %}
